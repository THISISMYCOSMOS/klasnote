<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>KLAS 강의 요약</title>
<link rel="stylesheet" href="campus.css" />
<link rel="stylesheet" href="ui.css" />
<style>
  html, body { width: 360px; }
  .pop { padding: 12px; display: flex; flex-direction: column; gap: var(--space); }
  .pop-header { display: flex; align-items: center; justify-content: space-between; }
  .pop-header h1 { font-size: 16px; margin: 0; }
  .conn-banner {
    margin: 0; padding: 6px 9px; border-radius: 6px; font-size: 12px; font-weight: 600;
    background: var(--bg); border: 1px solid var(--border); color: var(--burgundy-deep);
  }
  .conn-banner[data-state="off"] { background: #f7e9e3; }
  .pop-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
  .pop-item {
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 8px 10px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .pop-item__title { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
  .pop-item__sub { font-size: 12px; color: var(--ink-soft); }
  .pop-item__row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .mini-btn { border: none; border-radius: 6px; padding: 4px 9px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--burgundy); color: #fff; }
  .mini-btn:hover { background: var(--burgundy-deep); }
  .mini-btn:focus-visible { outline: 2px solid var(--burgundy-deep); outline-offset: 2px; }
  .empty-msg { font-size: 12px; color: var(--ink-soft); text-align: center; padding: 10px 4px; }
  .pop-footer { display: flex; justify-content: center; }
</style>
</head>
<body>
<div class="pop">
  <div class="pop-header">
    <h1>KLAS 강의 요약</h1>
    <button type="button" id="optionsBtn" class="btn btn--ghost btn--sm" aria-label="설정 열기">설정</button>
  </div>

  <p id="connBanner" class="conn-banner" role="status" aria-live="polite">확인 중…</p>

  <div id="campusHost" aria-label="우니와 광운대 캠퍼스 장면"></div>

  <ul id="popList" class="pop-list" aria-label="진행 중이거나 확인이 필요한 강의"></ul>
  <p id="emptyMsg" class="empty-msg" hidden>지금 진행 중이거나 확인이 필요한 요약이 없어요.</p>

  <div class="pop-footer">
    <button type="button" id="openOptionsFooter" class="btn btn--ghost btn--sm">설정 전체 열기</button>
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
